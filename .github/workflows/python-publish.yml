# Publishes spinn to PyPI when a GitHub release is published (trusted
# publishing: PyPI accepts uploads from this workflow in the 'pypi'
# environment, no token needed). The release tag must equal
# spinn.__version__, e.g. 0.3.0.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Test
      run: |
        pip install pytest
        pip install .
        pytest .

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write        # trusted publishing
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Check that the tag matches spinn.__version__
      run: |
        python - <<'EOF'
        import os, re, sys
        v = re.search(r"__version__ = '(.+)'",
                      open('spinn/__init__.py').read()).group(1)
        tag = os.environ['GITHUB_REF_NAME']
        if tag.lstrip('v') != v:
            sys.exit(f"release tag {tag} does not match __version__ {v}")
        print(f"version {v}")
        EOF
    - name: Build
      run: |
        python -m pip install --upgrade pip build
        python -m build
    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
